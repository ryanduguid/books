name: Test

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  setup_and_test:
    runs-on: macos-latest
    steps:
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.18.1'

      - name: Set yarn version
        run: yarn set version 1.22.18

      - name: Checkout Books
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: yarn

      - name: Check Test Runners
        run: yarn test:runners

      - name: Check Updater Redirects
        run: yarn test:updater

      - name: Check Settings Validation
        run: yarn test:settings

      - name: Check Development Validation
        run: yarn test:development-validation

      - name: Run Tests
        run: yarn test

  setup_and_uitest:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.18.1'

      - name: Set yarn version
        run: yarn set version 1.22.18

      - name: Checkout Books
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: yarn

      - name: Build Source Files
        run: yarn build --nosign --nopackage

      - name: Check Built Assets
        run: yarn test:assets

      - name: Run UI Tests
        run: yarn uitest
